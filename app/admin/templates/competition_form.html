{% extends "base.html" %}
{% block heading %}Новое соревнование{% endblock %}
{% block crumbs %}<a href="/admin/competitions">Соревнования</a> / новое{% endblock %}
{% block content %}
<div class="card" style="max-width:620px">
  <form method="post" action="/admin/competitions">
    <div class="field"><label>Название *</label><input type="text" name="name" required autofocus></div>
    <div class="grid c2">
      <div class="field"><label>Тип *</label>
        <select name="type">{% for t in types %}<option value="{{ t.value }}">{{ t.value }}</option>{% endfor %}</select>
      </div>
      <div class="field"><label>Локация</label><input type="text" name="location"></div>
    </div>
    <div class="grid c2">
      <div class="field"><label>Дата начала *</label><input type="date" name="start_date" required></div>
      <div class="field"><label>Дата окончания</label><input type="date" name="end_date"></div>
    </div>
    <div class="actions">
      <button class="btn" type="submit">Создать</button>
      <a class="btn secondary" href="/admin/competitions">Отмена</a>
    </div>
  </form>
</div>
{% endblock %}
