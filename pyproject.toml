[project]
name = "timeofthestars-backend"
version = "2.0.0"
description = "Backend for the hockey league «TIME OF THE STARS»"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["alembic", ".venv", "venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Русский текст в строках/комментариях даёт ложные срабатывания ambiguous-unicode
ignore = ["E501", "RUF001", "RUF002", "RUF003", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
