# Боевой compose. Отдельный файл, а не override к docker-compose.yml:
# Compose СКЛЕИВАЕТ списки ports при наложении файлов, поэтому снять публикацию
# 5432 через override невозможно. Выбирается через COMPOSE_FILE в .env.
name: tots

services:
  db:
    image: postgres:16-alpine
    container_name: tots_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?set DB_NAME in .env}
      POSTGRES_USER: ${DB_USER:?set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      TZ: Europe/Moscow
      PGTZ: Europe/Moscow
    # ports: нет вообще — api ходит к базе по внутренней сети compose.
    # ufw не фильтрует опубликованные Docker порты, так что публиковать 5432 нельзя.
    volumes:
      - tots_db_data:/var/lib/postgresql/data
    command: >
      postgres
      -c max_connections=50
      -c shared_buffers=128MB
      -c effective_cache_size=512MB
      -c work_mem=8MB
      -c maintenance_work_mem=64MB
      -c log_min_duration_statement=500
    healthcheck:
      # Двойной $$ — чтобы переменную развернул шелл внутри контейнера,
      # а не Compose при парсинге файла.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -q"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 768M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: tots-api:latest
    container_name: tots_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Явный environment приоритетнее env_file: случайный DB_HOST в .env
      # не сможет сломать контейнер.
      DB_HOST: db
      DB_PORT: 5432
      MEDIA_DIR: /app/media
      TZ: Europe/Moscow
    ports:
      # Только loopback: единственный клиент — Caddy на хосте.
      - "127.0.0.1:8002:8002"
    volumes:
      # Bind mount, чтобы Caddy отдавал /media напрямую с диска, минуя Python.
      - ${MEDIA_HOST_DIR:-/srv/tots/media}:/app/media
    healthcheck:
      # curl/wget в образе нет — только postgresql-client, поэтому urllib.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      # app.sh ждёт PG, потом alembic upgrade head, потом create_admin.py
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  tots_db_data:
